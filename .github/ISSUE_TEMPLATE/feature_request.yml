name: Idea or request
description: Suggest an improvement, a new companion, or new lines for an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is version 1 — the shape of it is still very much open. Ideas welcome.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of idea is this?
      options:
        - A new companion character
        - New lines for an existing companion
        - A change to how moods or thresholds work
        - Something about how it looks on screen
        - Support for another device
        - Something else
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and what would it be good for?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Adding a character or writing lines is genuinely approachable.** Each companion is a
        single plain-text file in `src/companion/sprites/` holding both its artwork and its
        dialogue — no image editor, no binary assets. See the README for the format. Pull
        requests very welcome.
