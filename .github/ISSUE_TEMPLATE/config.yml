blank_issues_enabled: true
contact_links:
  - name: Bug in CrossPoint itself, not the companion?
    url: https://github.com/crosspoint-reader/crosspoint-reader/issues
    about: |
      If the problem also happens with the companion turned off in Settings, it is a CrossPoint
      issue rather than a companion one. Report it upstream so it reaches the people who can fix it.
  - name: CrossPoint discussions
    url: https://github.com/crosspoint-reader/crosspoint-reader/discussions
    about: Questions about CrossPoint itself, its scope, or its roadmap.
